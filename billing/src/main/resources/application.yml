spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: billing_group_v0

kafka:
  topic: billing.audit.v0

server:
  port: 8083

swagger:
  url:
    path: /

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: ${swagger.url.path}swagger/v3/api-docs

billing:
  price:
    loading: 80
    unloading: 50

cache:
  name: billing
  expire-after-write: 30
  maximum-size: 1000