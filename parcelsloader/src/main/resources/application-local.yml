spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db?currentSchema=prcls
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: billing_group_v0

kafka:
  topic: billing.audit.v0

swagger:
  url:
    path: /

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: ${swagger.url.path}swagger/v3/api-docs

server:
  port: 8080

parcels:
  paging:
    default-limit: 20